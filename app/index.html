<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vice Cover Studio — GTA-style cover art maker</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('fonts/Anton-Regular.ttf') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1><span class="dot"></span>VICE COVER STUDIO</h1>
      <p class="tagline">make your own poster cover</p>
      <p class="privacy">Your photos never leave this machine.</p>
    </header>
    <main class="workspace">
      <section class="preview-pane">
        <canvas id="preview" width="1080" height="1080" aria-label="Live cover preview"></canvas>
        <canvas id="shot-canvas" hidden aria-label="Exported cover"></canvas>
        <p class="preview-hint">Click a panel to select it. Drag a photo inside its panel to reposition it.</p>
      </section>
      <aside class="controls">
        <section class="control-block">
          <h2>1 · Photos</h2>
          <label class="file-button" for="photo-input">Add photos from your machine</label>
          <input id="photo-input" type="file" accept="image/*" multiple hidden>
          <div id="tray" class="tray"></div>
          <div class="row">
            <button type="button" id="load-samples">Load the samples</button>
            <button type="button" id="fill-all">One photo in every panel</button>
          </div>
        </section>
        <section class="control-block">
          <h2>2 · Layout</h2>
          <div id="layout-options" class="options"></div>
          <label class="slider-label" for="zoom">Zoom the selected panel · <span id="zoom-value">100%</span></label>
          <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1">
        </section>
        <section class="control-block">
          <h2>3 · Colour grade</h2>
          <div id="grade-options" class="options"></div>
        </section>
        <section class="control-block">
          <h2>4 · Caption</h2>
          <input id="caption" type="text" value="NEON NIGHTS" maxlength="24" aria-label="Caption">
          <input id="subline" type="text" value="a vice cover story" maxlength="48" aria-label="Caption subline">
        </section>
        <section class="control-block">
          <h2>5 · Export</h2>
          <div id="size-options" class="options"></div>
          <button type="button" id="export" class="export-button">Export PNG</button>
          <p id="status" class="status" role="status">Add a photo to begin.</p>
        </section>
      </aside>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
